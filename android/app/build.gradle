// ponytail: 舊傳遞依賴拖進 kotlin-stdlib-jdk7/8:1.6.21，跟 1.8.22 打架，對齊即解
configurations.all {
    resolutionStrategy.eachDependency {
        if (requested.group == "org.jetbrains.kotlin" && requested.name.startsWith("kotlin-stdlib")) {
            useVersion("1.8.22")
            because("align CameraX/activity stdlib")
        }
    }
